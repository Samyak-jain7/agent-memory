[project]
name = "memory-system"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
  "opentelemetry-sdk>=1.27,<2",
  "httpx>=0.27,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".", "packages/contracts", "packages/memory-domain", "packages/persistence", "packages/model-gateway", "packages/observability", "packages/sdk-python"]
include = ["apps*", "contracts*", "memory_domain*", "persistence*", "model_gateway*", "observability*", "memory_sdk*"]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = [".", "packages/contracts", "packages/memory-domain", "packages/persistence", "packages/model-gateway", "packages/observability", "packages/sdk-python"]
testpaths = ["tests"]
